# Railway build config para el backend (@misanpedro/api).
#
# Railway usa Nixpacks por default. Este archivo le dice cómo
# construir el monorepo (pnpm workspaces) y arrancar el API.
#
# Si en el futuro montás un segundo service en Railway (ej. para
# el Owner Panel), creá su propio nixpacks.toml dentro de la carpeta
# del service o configurá overrides via Railway dashboard.

[phases.setup]
# Node 22 (matches engines.node en package.json)
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
# Corepack viene con Node 22 → activa pnpm según `packageManager` del root.
# Install COMPLETO: este servicio ahora sirve también los fronts (web + owner),
# así que necesita sus dependencias de build (vite, etc.), no solo las del API.
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.28.2 --activate",
  "pnpm install --frozen-lockfile"
]

[phases.build]
# Un solo servicio sirve API + fronts. Buildeamos web (PWA vecino+comercio),
# owner (panel super-admin) y api, con base "/" (se sirven en la raíz de cada
# host) y la URL absoluta del API (el front llama cross-origin; CORS permite
# *.micuidad.com). Turbo resuelve el orden y buildea @misanpedro/shared una vez.
cmds = [
  # Guardrail: falla el deploy si se reintrodujo una ciudad hardcodeada en web/owner.
  "node scripts/check-no-hardcoded-tenant.mjs",
  "VITE_BASE=/ VITE_API_URL=https://api-production-43c52.up.railway.app pnpm turbo run build --filter=@misanpedro/web --filter=@misanpedro/owner --filter=@misanpedro/api"
]

[start]
# Production start: lee env vars del environment, no de un .env file.
cmd = "node apps/api/dist/index.js"

[variables]
# Skip Chromium download de Puppeteer (whatsapp-web.js).
# Si más adelante querés activar WA Business en prod, instalá Chromium
# via nixPkgs (chromium) y borrá esta línea + setea PUPPETEER_EXECUTABLE_PATH.
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_SKIP_DOWNLOAD = "true"

# Activá HTTPS redirect + X-Forwarded-* en Railway
TRUST_PROXY = "true"

NODE_ENV = "production"
